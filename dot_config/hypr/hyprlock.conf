source = ~/.config/hypr/theme.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $background
    blur_passes = 3
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center
    inner_color = rgba(282A36cc)
    outer_color = $accent
    outline_thickness = 4
    font_family = CaskaydiaMono Nerd Font
    font_color = $foreground
    placeholder_text = Enter Password
    check_color = $accent
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
