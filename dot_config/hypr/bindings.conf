$terminal = uwsm app -- ghostty
$browser = uwsm app -- brave --new-window --ozone-platform=wayland
$fileManager = uwsm app -- nautilus --new-window
$launcher = walker

# Launching
bind = SUPER, RETURN, exec, $terminal
bind = SUPER SHIFT, RETURN, exec, $browser
bind = SUPER SHIFT, B, exec, $browser
bind = SUPER SHIFT ALT, B, exec, $browser --private
bind = SUPER SHIFT, F, exec, $fileManager
bind = SUPER, SPACE, exec, $launcher
bind = SUPER SHIFT, O, exec, ~/.config/hypr/scripts/require-command obsidian uwsm app -- obsidian
bind = SUPER SHIFT, M, exec, ~/.config/hypr/scripts/require-command spotify uwsm app -- spotify
bind = SUPER SHIFT, T, exec, $terminal -e btop
bind = SUPER SHIFT, D, exec, ~/.config/hypr/scripts/require-command lazydocker $terminal -e lazydocker

# Session
bind = SUPER SHIFT, Q, killactive
bind = SUPER, W, killactive
bind = SUPER SHIFT, E, exit
bind = SUPER, F, fullscreen
bind = SUPER CTRL, F, fullscreenstate, 0 2
bind = SUPER ALT, F, fullscreen, 1
bind = SUPER SHIFT, A, togglefloating
bind = SUPER, S, layoutmsg, togglesplit
bind = SUPER CTRL, L, exec, ~/.config/hypr/scripts/lock

# Clipboard
bind = SUPER, C, sendshortcut, CTRL, Insert, activewindow
bind = SUPER, V, sendshortcut, SHIFT, Insert, activewindow
bind = SUPER, X, sendshortcut, CTRL, X, activewindow
bind = SUPER CTRL, V, exec, walker -m clipboard

# Notifications
bind = SUPER, COMMA, exec, makoctl dismiss
bind = SUPER SHIFT, COMMA, exec, makoctl dismiss --all
bind = SUPER ALT, COMMA, exec, makoctl invoke
bind = SUPER SHIFT ALT, COMMA, exec, makoctl restore

# Local toggles
bind = SUPER SHIFT, SPACE, exec, ~/.config/hypr/scripts/toggle-waybar
bind = SUPER CTRL, N, exec, ~/.config/hypr/scripts/toggle-nightlight

# Focus
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# Move windows
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

# Swap windows
bind = SUPER ALT, H, swapwindow, l
bind = SUPER ALT, L, swapwindow, r
bind = SUPER ALT, K, swapwindow, u
bind = SUPER ALT, J, swapwindow, d

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
bind = SUPER SHIFT ALT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT ALT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT ALT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT ALT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT ALT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT ALT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT ALT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT ALT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT ALT, 9, movetoworkspacesilent, 9
bind = SUPER SHIFT ALT, 0, movetoworkspacesilent, 10
bind = SUPER, TAB, workspace, e+1
bind = SUPER SHIFT, TAB, workspace, e-1
bind = SUPER CTRL, TAB, workspace, previous

# Scratchpad and groups
bind = SUPER ALT, S, movetoworkspacesilent, special:scratchpad
bind = SUPER CTRL, S, togglespecialworkspace, scratchpad
bind = SUPER, G, togglegroup
bind = SUPER ALT, G, moveoutofgroup

# Mouse window control
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Screenshots
bind = , PRINT, exec, ~/.config/hypr/scripts/screenshot area
bind = SHIFT, PRINT, exec, ~/.config/hypr/scripts/screenshot output
bind = SUPER, PRINT, exec, ~/.config/hypr/scripts/color-picker

# Media and hardware
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl = , XF86AudioMute, exec, pamixer -t
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
