general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    resize_on_border = false
    allow_tearing = false
}

decoration {
    rounding = 8

    shadow {
        enabled = true
        range = 2
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        special = true
        brightness = 0.60
        contrast = 0.75
    }
}

group {
    col.border_active = rgba(F8F8F2ee) rgba(8BE9FDee) 45deg
    col.border_inactive = rgba(282A3688)
    col.border_locked_active = rgba(F8F8F2ee) rgba(8BE9FDee) 45deg
    col.border_locked_inactive = rgba(282A3688)

    groupbar {
        font_size = 12
        font_family = CaskaydiaMono Nerd Font
        indicator_height = 0
        indicator_gap = 5
        height = 22
        gaps_in = 5
        gaps_out = 0
        text_color = rgb(ffffff)
        text_color_inactive = rgba(ffffff90)
        col.active = rgba(00000040)
        col.inactive = rgba(00000020)
        gradients = true
        gradient_rounding = 8
    }
}

animations {
    enabled = true

    bezier = johann, 0.05, 0.9, 0.1, 1.0

    animation = windows, 1, 4, johann
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, johann
}

scrolling {
    column_width = 0.49
}

master {
    new_status = master
}
